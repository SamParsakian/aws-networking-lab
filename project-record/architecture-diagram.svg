<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 640" width="1000" height="640" font-family="Helvetica, Arial, sans-serif" font-size="14">
  <title>AWS networking lab architecture</title>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#232f3e"/>
    </marker>
  </defs>

  <rect width="1000" height="640" fill="#ffffff"/>

  <!-- Internet -->
  <rect x="75" y="20" width="200" height="50" rx="25" fill="#eef1f4" stroke="#232f3e" stroke-width="2"/>
  <text x="175" y="51" text-anchor="middle" font-weight="bold" fill="#232f3e">Internet</text>
  <line x1="175" y1="70" x2="175" y2="108" stroke="#232f3e" stroke-width="2" marker-end="url(#arrow)" marker-start="url(#arrow)"/>

  <!-- VPC -->
  <rect x="40" y="130" width="920" height="490" rx="8" fill="#fbfcfd" stroke="#232f3e" stroke-width="2"/>
  <text x="940" y="156" text-anchor="end" font-weight="bold" fill="#232f3e">VPC  10.0.0.0/16   (eu-north-1)</text>

  <!-- Internet Gateway on the VPC edge -->
  <rect x="70" y="110" width="210" height="40" rx="6" fill="#ffffff" stroke="#232f3e" stroke-width="2"/>
  <text x="175" y="135" text-anchor="middle" font-weight="bold" fill="#232f3e">Internet Gateway</text>

  <!-- Availability zone -->
  <rect x="60" y="175" width="880" height="425" rx="8" fill="none" stroke="#7a8794" stroke-width="1.5" stroke-dasharray="6 5"/>
  <text x="76" y="196" fill="#55616d">Availability Zone eu-north-1a</text>

  <!-- Public subnet -->
  <rect x="90" y="215" width="410" height="365" rx="8" fill="#e9f6ec" stroke="#2e7d32" stroke-width="2"/>
  <text x="105" y="240" font-weight="bold" fill="#1b5e20">Public subnet  10.0.1.0/24</text>

  <rect x="185" y="270" width="170" height="70" rx="6" fill="#ffffff" stroke="#2e7d32" stroke-width="2"/>
  <text x="270" y="297" text-anchor="middle" font-weight="bold" fill="#232f3e">Public EC2</text>
  <text x="270" y="318" text-anchor="middle" fill="#55616d">t3.micro, public IP</text>

  <rect x="185" y="400" width="170" height="70" rx="6" fill="#ffffff" stroke="#2e7d32" stroke-width="2"/>
  <text x="270" y="427" text-anchor="middle" font-weight="bold" fill="#232f3e">NAT Gateway</text>
  <text x="270" y="448" text-anchor="middle" fill="#55616d">with Elastic IP</text>

  <text x="105" y="520" fill="#1b5e20" font-weight="bold">Public route table</text>
  <text x="105" y="540" fill="#232f3e">0.0.0.0/0  to  Internet Gateway</text>
  <text x="105" y="560" fill="#232f3e">10.0.0.0/16  local</text>

  <!-- Private subnet -->
  <rect x="520" y="215" width="400" height="365" rx="8" fill="#e8f1fb" stroke="#1565c0" stroke-width="2"/>
  <text x="535" y="240" font-weight="bold" fill="#0d47a1">Private subnet  10.0.2.0/24</text>

  <rect x="635" y="270" width="170" height="70" rx="6" fill="#ffffff" stroke="#1565c0" stroke-width="2"/>
  <text x="720" y="297" text-anchor="middle" font-weight="bold" fill="#232f3e">Private EC2</text>
  <text x="720" y="318" text-anchor="middle" fill="#55616d">t3.micro, no public IP</text>

  <text x="535" y="520" fill="#0d47a1" font-weight="bold">Private route table</text>
  <text x="535" y="540" fill="#232f3e">0.0.0.0/0  to  NAT Gateway</text>
  <text x="535" y="560" fill="#232f3e">10.0.0.0/16  local</text>

  <!-- Internet Gateway to public EC2 (SSH from own IP) -->
  <line x1="270" y1="150" x2="270" y2="268" stroke="#232f3e" stroke-width="2" marker-end="url(#arrow)" marker-start="url(#arrow)"/>
  <text x="292" y="166" fill="#232f3e" font-size="13">SSH from own /32 only</text>

  <!-- Public EC2 to private EC2 -->
  <line x1="357" y1="305" x2="633" y2="305" stroke="#232f3e" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="372" y="296" fill="#232f3e" font-size="13">SSH and ping</text>

  <!-- Private EC2 outbound to NAT Gateway -->
  <polyline points="720,342 720,435 357,435" fill="none" stroke="#232f3e" stroke-width="2" stroke-dasharray="7 5" marker-end="url(#arrow)"/>
  <text x="535" y="426" fill="#232f3e" font-size="13">outbound only</text>

  <!-- NAT Gateway out through the Internet Gateway -->
  <polyline points="183,435 130,435 130,152" fill="none" stroke="#232f3e" stroke-width="2" stroke-dasharray="7 5" marker-end="url(#arrow)"/>
  <text x="122" y="330" text-anchor="middle" fill="#232f3e" font-size="13" transform="rotate(-90 122 330)">NAT traffic leaves here</text>
</svg>
